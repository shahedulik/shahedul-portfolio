name: Auto-install three.js dependencies
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch: {}
concurrency:
  group: install-deps-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install three + @types/three
        run: npm install three @types/three --save
      - name: Commit and push updated manifests
        env:
          TOKEN: ${{ secrets.DEPENDENCY_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "package.json / package-lock.json unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): add three + @types/three [skip ci]"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          git push origin main
